[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tolerance-stackup"
version = "1.0.0"
description = "Worst-case, RSS and Monte Carlo tolerance stack-up calculator"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "matplotlib"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anthony Saldutti" }]

[project.optional-dependencies]
dev = ["pytest", "ipykernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
stackup = "stackup.cli:main"
